<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="/logo.ico" type="image/x-icon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 | Weavo</title>
<meta name="description" content="Weavo의 모든 공동 모자이크 프로젝트를 둘러보고 각 커뮤니티 캔버스가 어떻게 완성되어 가는지 확인하세요.">
<link rel="canonical" href="https://weavo.art/ko/projects">
<link rel="alternate" hreflang="en" href="https://weavo.art/en/projects">
<link rel="alternate" hreflang="ko" href="https://weavo.art/ko/projects">
<link rel="alternate" hreflang="x-default" href="https://weavo.art/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Weavo">
<meta property="og:title" content="프로젝트 | Weavo">
<meta property="og:description" content="Weavo의 모든 공동 모자이크 프로젝트를 둘러보고 각 커뮤니티 캔버스가 어떻게 완성되어 가는지 확인하세요.">
<meta property="og:url" content="https://weavo.art/ko/projects">
<meta property="og:image" content="https://weavo.art/logo.png">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="프로젝트 | Weavo">
<meta name="twitter:description" content="Weavo의 모든 공동 모자이크 프로젝트를 둘러보고 각 커뮤니티 캔버스가 어떻게 완성되어 가는지 확인하세요.">
<meta name="twitter:image" content="https://weavo.art/logo.png">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Weavo","item":"https://weavo.art/ko/"},{"@type":"ListItem","position":2,"name":"프로젝트","item":"https://weavo.art/ko/projects"}]}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/home.css">
</head>
<body>

<div class="app">
  <header class="topnav">
    <a class="logo" id="logoHome" href="/ko/">Weavo</a>
    <nav class="nav-right">
      <a href="/ko/projects" class="nav-link active">프로젝트</a>
      <a href="/ko/network" class="nav-link">네트워크</a>
      <a href="/ko/about" class="nav-link">소개</a>
      <div id="identity">
        <div class="lang-toggle" id="langToggle">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="ko">한</button>
        </div>
        <img id="myAvatar" alt="">
        <span id="myName" class="guest">게스트</span>
        <button id="loginBtn" class="id-btn">로그인</button>
        <button id="logoutBtn" class="id-btn" style="display:none">로그아웃</button>
      </div>
    </nav>
  </header>

  <main class="main-scroll home-scroll">
    <h1 class="sr-only">프로젝트</h1>
    <section class="snap-panel" id="currentProjectsPanel">
      <div class="carousel-section" id="carouselSection">
        <div class="carousel-header">
          <h2 class="section-label">진행 중인 프로젝트</h2>
          <div class="carousel-nav">
            <button class="car-arrow" id="carPrev" aria-label="이전 프로젝트">&#8249;</button>
            <button class="car-arrow" id="carNext" aria-label="다음 프로젝트">&#8250;</button>
          </div>
        </div>
        <div class="carousel-track-wrap">
          <div class="carousel-track" id="carouselTrack"></div>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
      </div>

      <button type="button" class="scroll-hint" id="scrollHint" aria-label="전체 프로젝트로 스크롤">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </section>

    <section class="snap-panel" id="projectsPanel">
      <div class="carousel-header" style="margin-top:32px;">
        <h2 class="section-label">전체 프로젝트</h2>
        <button class="cta-text" id="newProjectBtn" style="display:none;margin-top:0;">+ 새 프로젝트</button>
      </div>
      <div class="projects-grid" id="projectsGrid"></div>
      <div class="empty-note" id="projectsEmpty" style="display:none;">아직 프로젝트가 없습니다.</div>
    </section>
  </main>
  <footer id="legal-footer">
    <a href="/ko/privacy">개인정보처리방침</a>
    <span class="sep" aria-hidden="true">&middot;</span>
    <a href="/ko/disclaimer">면책조항</a>
  </footer>
</div>

<!-- New project modal (admin only) -->
<div id="new-project-modal" class="modal-overlay">
  <div id="new-project-dialog" class="modal-panel">
    <h3>새 Weavo 프로젝트</h3>
    <div class="field">
      <label for="np-title">제목</label>
      <input type="text" id="np-title" placeholder="프로젝트 제목" maxlength="60">
    </div>
    <div class="field">
      <label for="np-desc">설명 <span class="field-hint">(선택)</span></label>
      <textarea id="np-desc" placeholder="이 Weavo는 무엇에 관한 건가요?" maxlength="300"></textarea>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="field" style="flex:1;">
        <label for="np-width">너비 (칸 수)</label>
        <input type="text" inputmode="numeric" id="np-width" placeholder="예: 40">
      </div>
      <div class="field" style="flex:1;">
        <label for="np-height">높이 (칸 수)</label>
        <input type="text" inputmode="numeric" id="np-height" placeholder="예: 30">
      </div>
    </div>
    <div class="field">
      <label>참조 이미지</label>
      <div class="img-upload-area" id="ref-picker">
        <div class="img-placeholder"><span class="up-icon">🖼</span><span>클릭하거나 이미지를 끌어다 놓으세요</span></div>
        <img class="img-preview" alt="">
        <button type="button" class="img-remove" aria-label="이미지 제거">✕</button>
        <input type="file" class="img-input" accept="image/*">
      </div>
    </div>
    <div class="field-error" id="np-error"></div>
    <div class="modal-actions">
      <button id="np-cancel" class="btn-cancel">취소</button>
      <button id="np-submit" class="btn-primary">만들기</button>
    </div>
  </div>
</div>

<!-- Edit profile modal -->
<div id="edit-profile-modal" class="modal-overlay">
  <div id="edit-profile-dialog" class="modal-panel">
    <div style="display:flex;justify-content:flex-end;margin:0 0 8px;">
      <div class="lang-toggle">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ko">한</button>
      </div>
    </div>
    <h3 id="ep-dialog-title">프로필 수정</h3>
    <p id="ep-required-note" style="display:none;font-size:12px;color:var(--muted);margin-top:-8px;">계정을 완성하려면 사용자 이름을 설정하세요.</p>
    <div class="field" style="align-items:center;">
      <label style="text-align:center;">프로필 사진 <span class="field-hint">(선택)</span></label>
      <div class="img-upload-area avatar-picker" id="ep-avatar-picker">
        <div class="img-placeholder"><span class="up-icon">🙂</span><span>업로드</span></div>
        <img class="img-preview" alt="">
        <button type="button" class="img-remove" aria-label="프로필 사진 제거">✕</button>
        <input type="file" class="img-input" accept="image/*">
      </div>
    </div>
    <div class="field">
      <label for="ep-username">사용자 이름<span class="field-hint" id="ep-username-hint"></span></label>
      <input type="text" id="ep-username" placeholder="사용자이름" maxlength="30">
    </div>
    <div class="field">
      <label for="ep-country">국가</label>
      <select id="ep-country">
        <option value="">국가를 선택하세요&hellip;</option>
      </select>
    </div>
    <div class="field">
      <label for="ep-bio">소개 <span class="field-hint">(선택)</span></label>
      <textarea id="ep-bio" placeholder="자신을 간단히 소개해보세요…" maxlength="300"></textarea>
    </div>
    <div id="ep-links-fields"></div>
    <div class="field-error" id="ep-error"></div>
    <div class="modal-actions">
      <button id="ep-cancel" class="btn-cancel">취소</button>
      <button id="ep-submit" class="btn-primary">저장</button>
    </div>
    <div class="ep-danger-zone" id="ep-danger-zone">
      <button type="button" id="ep-delete-account" class="link-danger">계정 삭제</button>
    </div>
  </div>
</div>

<!-- Auth modal -->
<div id="auth-modal" class="modal-overlay">
  <div id="auth-dialog" class="modal-panel">
    <div class="auth-icon">🖼️</div>
    <h3>Weavo에 참여하기</h3>
    <p>커뮤니티 Weavo에 작품을 제출하려면 로그인하세요.</p>
    <button id="google-signin-btn" class="oauth-signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908C16.658 14.013 17.64 11.705 17.64 9.2z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Google로 계속하기</span>
    </button>
    <button id="kakao-signin-btn" class="oauth-signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#191919" d="M9 2.2C4.7 2.2 1.2 4.94 1.2 8.32c0 2.16 1.44 4.06 3.62 5.15-.16.57-.57 2.06-.65 2.38-.1.39.14.39.3.28.13-.08 2.06-1.4 2.9-1.97.5.07 1.02.11 1.55.11 4.3 0 7.8-2.74 7.8-6.12S13.3 2.2 9 2.2z"/>
      </svg>
      <span>카카오로 계속하기</span>
    </button>
    <button id="auth-close">나중에 하기</button>
  </div>
</div>

<!-- Confirm dialog -->
<div id="confirm-modal" class="modal-overlay">
  <div id="confirm-dialog" class="modal-panel">
    <h3 id="confirm-title">확실한가요?</h3>
    <p id="confirm-message" style="font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 4px;"></p>
    <div class="field" id="confirm-input-wrap" style="display:none;margin:2px 0 0;">
      <input type="text" id="confirm-input" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn-cancel">취소</button>
      <button id="confirm-ok" class="btn-primary">계속</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/supabase-client.js"></script>
<script src="/js/i18n/ko.js"></script>
<script src="/js/common.js"></script>
<script src="/js/color-engine.js"></script>
<script src="/js/matching.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/project-preview.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
