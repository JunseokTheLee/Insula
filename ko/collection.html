<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="/logo.ico" type="image/x-icon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weavo — 컬렉션</title>
<meta name="description" content="Weavo에서 큐레이션된 작품 컬렉션입니다.">
<link rel="canonical" href="https://weavo.art/ko/projects">
<link rel="alternate" hreflang="en" href="https://weavo.art/en/projects">
<link rel="alternate" hreflang="ko" href="https://weavo.art/ko/projects">
<link rel="alternate" hreflang="x-default" href="https://weavo.art/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Weavo">
<meta property="og:title" content="Weavo — 컬렉션">
<meta property="og:description" content="Weavo에서 큐레이션된 작품 컬렉션입니다.">
<meta property="og:url" content="https://weavo.art/ko/projects">
<meta property="og:image" content="https://weavo.art/logo.png">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Weavo — 컬렉션">
<meta name="twitter:description" content="Weavo에서 큐레이션된 작품 컬렉션입니다.">
<meta name="twitter:image" content="https://weavo.art/logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/project.css">
<link rel="stylesheet" href="/css/profile.css">
</head>
<body>

<div class="app">
  <header class="topnav">
   <a class="logo" id="logoHome" href="/ko/">Weavo</a>
    <nav class="nav-links">
      <a href="/ko/projects" class="nav-link">프로젝트</a>
      <a href="/ko/network" class="nav-link">네트워크</a>
      <a href="/ko/artists" class="nav-link">작가</a>
      <a href="/ko/about" class="nav-link">소개</a>
    </nav>
    <div id="identity">
        <div class="lang-toggle" id="langToggle">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="ko">한</button>
        </div>
        <img id="myAvatar" alt="">
        <span id="myName" class="guest">게스트</span>
        <button id="loginBtn" class="id-btn">로그인</button>
        <button id="logoutBtn" class="id-btn" style="display:none">로그아웃</button>
      </div>
  </header>

  <main class="main main-scroll">
    <div class="backnav">
      <a class="back" id="collectionBackBtn" href="/ko/projects">&larr; 뒤로</a>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button class="btn-cancel" id="addArtworkBtn" style="display:none;padding:11px 18px;border-radius:20px;font-family:'General Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">
          + 작품 추가
        </button>
        <button class="btn-cancel" id="editCollectionBtn" style="display:none;padding:11px 18px;border-radius:20px;font-family:'General Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">
          수정
        </button>
        <button class="btn-cancel" id="deleteCollectionBtn" style="display:none;padding:11px 18px;border-radius:20px;font-family:'General Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--coral);">
          삭제
        </button>
      </div>
    </div>
    <div class="project-head">
      <h1 id="collectionTitle">불러오는 중…</h1>
      <div class="profile-meta" id="collectionMeta"></div>
      <p id="collectionDesc" style="display:none;"></p>
      <div id="collectionOwnerByline"></div>
    </div>
    <div class="profile-art-grid" id="collectionItemsGrid"></div>
    <div class="empty-note" id="collectionItemsEmpty" style="display:none;">아직 컬렉션에 추가된 작품이 없습니다.</div>
  </main>
  <footer id="legal-footer">
    <a href="/ko/privacy">개인정보처리방침</a>
    <span class="sep" aria-hidden="true">&middot;</span>
    <a href="/ko/disclaimer">면책조항</a>
  </footer>
</div>

<!-- Edit collection modal -->
<div id="edit-collection-modal" class="modal-overlay">
  <div id="edit-collection-dialog" class="modal-panel">
    <h3>컬렉션 수정</h3>
    <div class="field">
      <label for="ec-title">제목</label>
      <input type="text" id="ec-title" maxlength="80">
    </div>
    <div class="field">
      <label for="ec-desc">설명 <span class="field-hint">(선택)</span></label>
      <textarea id="ec-desc" maxlength="500"></textarea>
    </div>
    <div class="field">
      <label for="ec-public" style="display:flex;align-items:center;gap:8px;font-weight:400;">
        <input type="checkbox" id="ec-public" style="width:auto;">
        모두에게 공개
      </label>
    </div>
    <div class="field-error" id="ec-error"></div>
    <div class="modal-actions">
      <button id="ec-cancel" class="btn-cancel">취소</button>
      <button id="ec-submit" class="btn-primary">저장</button>
    </div>
  </div>
</div>

<!-- Add artwork picker -->
<div id="add-artwork-modal" class="modal-overlay">
  <div id="add-artwork-dialog" class="modal-panel">
    <h3>작품 추가</h3>
    <div id="aa-list"></div>
    <div class="empty-note" id="aa-empty" style="display:none;padding:16px;">저장한 작품이 아직 없습니다 — 먼저 작품을 컬렉트해보세요.</div>
    <div class="modal-actions">
      <button id="aa-done" class="btn-primary">완료</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox-modal" class="modal-overlay lightbox-overlay">
  <div class="lightbox-stage" id="lightboxStage">
    <div class="zoom-toolbar">
      <button type="button" class="zoom-btn" id="lightbox-zoom-out" aria-label="축소">&minus;</button>
      <span class="zoom-level" id="lightbox-zoom-level">100%</span>
      <button type="button" class="zoom-btn" id="lightbox-zoom-in" aria-label="확대">+</button>
      <button type="button" class="zoom-btn" id="lightbox-close" aria-label="닫기">&#10005;</button>
    </div>
    <img id="lightbox-img" src="" alt="">
  </div>
  <div id="lightbox-caption">
    <div id="lightbox-cap-title"></div>
    <div id="lightbox-cap-meta"></div>
    <div id="lightbox-artist-card">
      <div id="lightbox-artist-avatar-wrap"></div>
      <div class="lb-artist-info">
        <a id="lightbox-artist-name" class="lb-artist-name"></a>
      </div>
    <button type="button" id="lightbox-artist-save-btn" class="lb-artist-save-btn" style="display:none;">저장</button>
    </div>
    <div id="lightbox-artist-about">
      <div class="lb-artist-about-label">작가 소개</div>
      <div id="lightbox-artist-bio" class="lb-artist-bio"></div>
    </div>
    <div id="lightbox-cap-desc"></div>
    <a id="lightbox-cap-link" target="_blank" rel="ugc nofollow noopener noreferrer"></a>
    <div class="lightbox-actions">
      <button type="button" id="lb-like-btn" class="lb-action-btn" aria-label="이 작품 좋아요">
        <span class="icon"></span><span id="lb-like-count">0</span>
      </button>
      <button type="button" id="lb-comments-btn" class="lb-action-btn active" aria-label="댓글 보기" aria-expanded="true">
        <span class="icon"></span><span id="lb-comments-count">0</span>
      </button>
      <button type="button" id="lb-delete-btn" class="lb-action-btn" aria-label="이 작품 삭제" style="display:none;">
        <span class="icon"></span><span>삭제</span>
      </button>
      <button type="button" id="lb-remove-btn" class="lb-action-btn" aria-label="프로젝트에서 제외" style="display:none;">
        <span class="icon"></span><span>프로젝트에서 제외</span>
      </button>
    </div>
    <div id="lightbox-comments" class="lightbox-comments open">
      <div id="lightbox-comments-list"></div>
      <div id="lightbox-comment-form">
        <textarea id="lightbox-comment-input" placeholder="댓글을 입력하세요…" maxlength="1000"></textarea>
        <button type="button" id="lightbox-comment-post">게시</button>
      </div>
    </div>
    <div id="lightbox-country-map">
      <div class="lb-country-map-label" id="lb-country-map-label"></div>
      <svg id="lb-country-map-svg" viewBox="0 0 280 150" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>
</div>

<!-- Edit profile modal -->
<div id="edit-profile-modal" class="modal-overlay">
  <div id="edit-profile-dialog" class="modal-panel">
    <div style="display:flex;justify-content:flex-end;margin:0 0 8px;">
      <div class="lang-toggle">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ko">한</button>
      </div>
    </div>
    <h3 id="ep-dialog-title">프로필 수정</h3>
    <p id="ep-required-note" style="display:none;font-size:12px;color:var(--muted);margin-top:-8px;">계정 설정을 완료하려면 사용자 이름을 설정하세요.</p>
    <div class="field" style="align-items:center;">
      <label style="text-align:center;">프로필 사진 <span class="field-hint">(선택)</span></label>
      <div class="img-upload-area avatar-picker" id="ep-avatar-picker">
        <div class="img-placeholder"><span class="up-icon">🙂</span><span>업로드</span></div>
        <img class="img-preview" alt="">
        <button type="button" class="img-remove" aria-label="프로필 사진 제거">✕</button>
        <input type="file" class="img-input" accept="image/*">
      </div>
    </div>
    <div class="field">
      <label for="ep-username">사용자 이름<span class="field-hint" id="ep-username-hint"></span></label>
      <input type="text" id="ep-username" placeholder="yourname" maxlength="30">
    </div>
    <div class="field">
      <label for="ep-country">국가</label>
      <select id="ep-country">
        <option value="">국가를 선택하세요&hellip;</option>
      </select>
    </div>
    <div class="field">
      <label for="ep-bio">소개 <span class="field-hint">(선택)</span></label>
      <textarea id="ep-bio" placeholder="자신을 간단히 소개해보세요…" maxlength="300"></textarea>
    </div>
    <div id="ep-links-fields"></div>
    <div class="field-error" id="ep-error"></div>
    <div class="modal-actions">
      <button id="ep-cancel" class="btn-cancel">취소</button>
      <button id="ep-submit" class="btn-primary">저장</button>
    </div>
    <div class="ep-danger-zone" id="ep-danger-zone">
      <button type="button" id="ep-delete-account" class="link-danger">계정 삭제</button>
    </div>
  </div>
</div>

<!-- Auth modal -->
<div id="auth-modal" class="modal-overlay">
  <div id="auth-dialog" class="modal-panel">
    <div class="auth-icon">🖼️</div>
    <h3>Weavo 가입하기</h3>
    <p>로그인하고 커뮤니티 Weavo에 작품을 제출해보세요.</p>
    <button id="google-signin-btn" class="oauth-signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908C16.658 14.013 17.64 11.705 17.64 9.2z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Google로 계속하기</span>
    </button>
    <button id="auth-close">나중에</button>
  </div>
</div>

<!-- Confirm dialog -->
<div id="confirm-modal" class="modal-overlay">
  <div id="confirm-dialog" class="modal-panel">
    <h3 id="confirm-title">확실한가요?</h3>
    <p id="confirm-message" style="font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 4px;"></p>
    <div class="field" id="confirm-input-wrap" style="display:none;margin:2px 0 0;">
      <input type="text" id="confirm-input" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn-cancel">취소</button>
      <button id="confirm-ok" class="btn-primary">계속</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/supabase-client.js"></script>
<script src="/js/i18n/ko.js"></script>
<script src="/js/common.js"></script>
<script src="/js/color-engine.js"></script>
<script src="/js/matching.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/lightbox.js"></script>
<script src="/js/collection.js"></script>
</body>
</html>
