<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/logo.ico" type="image/x-icon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weavo — A Collaborative Art Community</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#fff; color:#111;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
  }
  #inner {
    display:flex; flex-direction:column; align-items:center;
    gap:18px; text-align:center; padding:24px;
  }
  #logo {
    width:64px; height:64px; border-radius:14px; object-fit:cover;
  }
  h1 {
    font-size:56px; font-weight:800; letter-spacing:-.03em; line-height:1;
  }
  p {
    font-size:15px; color:#888; max-width:280px; line-height:1.55;
  }
  #enter-btn {
    margin-top:6px; appearance:none;
    border:1.5px solid #111; background:transparent;
    color:#111; font-family:inherit; font-size:14px; font-weight:600;
    padding:11px 30px; border-radius:99px; cursor:pointer; letter-spacing:.01em;
    transition:background .12s, color .12s, transform .1s;
  }
  #enter-btn:hover { background:#111; color:#fff; transform:translateY(-1px); }
</style>
</head>
<body>
  <div id="inner">
    <img id="logo" src="logo.png" alt="">
    <h1>Weavo</h1>
    <p>A collaborative art community where neurodivergent and neurotypical artists create together, from every country</p>
    <button id="enter-btn" onclick="location.href='/'">Explore the map</button>
  </div>
</body>
</html>
