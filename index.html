<link rel="icon" href="logo.ico" type="image/x-icon">
<script>
  // Weavo is now split into per-language, per-feature pages under /en/ and
  // /ko/ (see the site's git history for the previous single-file SPA).
  // This root page only picks which language directory to send a visitor
  // into, the same way the old in-app language toggle used to decide it.
  // /en/ and /ko/ (each dir's index.html, the marketing landing page) are
  // the default entry points; the projects app lives at projects.html
  // within that language directory.
  // Preserves location.hash as well as location.search — if this root page
  // is ever hit as a Supabase OAuth redirect fallback (e.g. the Redirect
  // URLs allowlist doesn't cover the destination page yet), the session
  // tokens Supabase appends can arrive as a #hash fragment, and dropping
  // that here would silently sign the user right back out downstream.
  var lang = localStorage.getItem('weavoLang') === 'ko' ? 'ko' : (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
  location.replace(lang + '/' + location.search + location.hash);
</script>
<link rel="alternate" hreflang="ko" href="https://weavo.art/ko/">
<link rel="alternate" hreflang="en" href="https://weavo.art/en/">
<link rel="alternate" hreflang="x-default" href="https://weavo.art/">
</head>
<body>
  <noscript>
    <p>Weavo requires JavaScript. Continue to <a href="/en/">English</a> or <a href="/ko/">한국어</a>.</p>
  </noscript>
</body>
</html>
