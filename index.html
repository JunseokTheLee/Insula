<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weavo — Community Art Mosaic</title>
<link rel="icon" href="logo.ico" type="image/x-icon">
<script>
  // Weavo is now split into per-language, per-feature pages under /en/ and
  // /ko/ (see the site's git history for the previous single-file SPA).
  // This root page only picks which language directory to send a visitor
  // into, the same way the old in-app language toggle used to decide it.
  // landing.html (the marketing hero) is the default entry point; the
  // projects app itself lives at index.html within that language directory.
  var lang = localStorage.getItem('weavoLang') === 'ko' ? 'ko' : (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
  location.replace(lang + '/landing.html' + location.search);
</script>
</head>
<body>
  <noscript>
    <p>Weavo requires JavaScript. Continue to <a href="en/landing.html">English</a> or <a href="ko/landing.html">한국어</a>.</p>
  </noscript>
</body>
</html>
